[project]
name = "cua-eval"
version = "0.1.0"
description = "评测『模型 + harness』组成的 Computer-Use Agent 在公开 benchmark 上的表现"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.12,<3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "deepseek-harness-sdk==0.1.1rc1",
  "pillow>=12.3.0",
]

[project.scripts]
cua-eval = "cua_eval.cli:app"
cua-eval-desktop-mcp = "cua_eval.harness.desktop_mcp:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_eval"]

# deepseek-harness-sdk（M4 才引入）目前只有预发布版。用 allow 会顺带把 pydantic
# 拉成 beta，污染 schema 层；if-necessary 只让确实没有正式版的包走预发布。
# 不要改成 if-necessary-or-explicit——uv 已将其标记为弃用。见 AGENTS.md 6.1。
[tool.uv]
prerelease = "if-necessary"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 把中文全角标点判为「歧义字符」。本项目的注释与 docstring 按约定
# 用中文（代码、CLI、标识符用英文），所以这组规则整体关掉，而不是把中文标点改成
# 半角——后者只会让中文读起来别扭。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "deepseek_harness", "deepseek_harness.*", "deepseek_harness_runtime", "deepseek_harness_runtime.*", "desktop_env", "desktop_env.*", "sci", "sci.*", "controllers", "controllers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "osworld: 需要真实 OSWorld 环境，默认 skip，除非 CUA_EVAL_OSWORLD=1",
  "scienceboard: 需要真实 ScienceBoard VM，默认 skip，除非 CUA_EVAL_SCIENCEBOARD=1",
  "mac_agent_bench: 需要远程 macOS 沙箱，默认 skip，除非 CUA_EVAL_MAC_AGENT_BENCH=1",
]
